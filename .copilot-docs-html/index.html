<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown HTML Index</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
        color: #2d2418;
        background: linear-gradient(180deg, #fdf9f1 0%, #efe8da 100%);
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 251, 245, 0.92);
        border: 1px solid rgba(106, 88, 62, 0.16);
        box-shadow: 0 20px 60px rgba(92, 71, 44, 0.08);
      }

      h1 { margin-top: 0; }

      .search-panel {
        margin: 20px 0 24px;
      }

      .search-panel label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .search-panel input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(106, 88, 62, 0.2);
        font: inherit;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      li {
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(145, 95, 54, 0.08);
      }

      a {
        color: #6b4324;
        font-weight: 700;
        text-decoration: none;
      }

      span {
        display: block;
        margin-top: 4px;
        color: #6e6255;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML 化された Markdown 資料</h1>
      <p>生成された各ページをここから開けます。</p>
      
      <div class="search-panel">
        <label for="index-search">資料検索</label>
        <input id="index-search" type="search" placeholder="タイトルやファイル名を検索" />
      </div>
      <ul>
        
      <li data-search-text="AI エージェント一覧と開発フロー agents.html">
        <a href="agents.html">AI エージェント一覧と開発フロー</a>
        <span>agents.html</span>
      </li>

      <li data-search-text="MCP ツール一覧・仕様 api.html">
        <a href="api.html">MCP ツール一覧・仕様</a>
        <span>api.html</span>
      </li>

      <li data-search-text="アーキテクチャ概要 architecture.html">
        <a href="architecture.html">アーキテクチャ概要</a>
        <span>architecture.html</span>
      </li>

      <li data-search-text="ドキュメント目次 index.html">
        <a href="index.html">ドキュメント目次</a>
        <span>index.html</span>
      </li>

      <li data-search-text="運用・操作フロー operation.html">
        <a href="operation.html">運用・操作フロー</a>
        <span>operation.html</span>
      </li>

      <li data-search-text="UI デザインガイド ui-design.html">
        <a href="ui-design.html">UI デザインガイド</a>
        <span>ui-design.html</span>
      </li>
      </ul>
    </main>
    
    <script>
      const input = document.getElementById("index-search");
      const items = Array.from(document.querySelectorAll("[data-search-text]"));

      if (input) {
        input.addEventListener("input", () => {
          const query = input.value.trim().toLowerCase();
          for (const item of items) {
            const matched = !query || item.dataset.searchText.toLowerCase().includes(query);
            item.hidden = !matched;
          }
        });
      }
    </script>
  </body>
</html>
